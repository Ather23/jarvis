[package]
name = "jarvis-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Core library for Jarvis AI agent with streaming and tool support"
repository = "https://github.com/yourusername/jarvis"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
schemars = "0.8"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "stream"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
