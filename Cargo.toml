[workspace]
members = [
    "jarvis-core",
    "jarvis-cli",
    "jarvis-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Developer"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
schemars = "0.8"
rig-core = "0.27.0"
rig-derive = "0.1.10"
